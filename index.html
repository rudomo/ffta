<!DOCTYPE html>
<html lang="en" data-theme="light-slate">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFTA Tools Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ocean: {
                            900: '#0a192f',
                            800: '#112240',
                            700: '#1d3557',
                            600: '#457b9d',
                            accent: '#64ffda',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .card-hover-effect {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover-effect:hover {
            transform: translateY(-8px);
        }

        /* Theme definitions (6 total options: 3 bright, 3 dark) */
        body.theme-light-slate {
            background: linear-gradient(to bottom right, #f8fafc, #f1f5f9, #e2e8f0);
            color: #1e293b;
        }
        body.theme-light-slate .theme-card {
            background-color: #ffffff;
            border-color: #f1f5f9;
            box-shadow: 0 20px 25px -5px rgba(226, 232, 240, 0.5);
        }
        body.theme-light-slate .theme-title { color: #0f172a; }
        body.theme-light-slate .theme-card-title { color: #334155; }
        body.theme-light-slate .theme-card-sub { color: #94a3b8; }

        body.theme-light-warm {
            background: linear-gradient(to bottom right, #fffbeb, #fef3c7, #fde68a);
            color: #451a03;
        }
        body.theme-light-warm .theme-card {
            background-color: #fffdf9;
            border-color: #fef3c7;
            box-shadow: 0 20px 25px -5px rgba(253, 230, 138, 0.4);
        }
        body.theme-light-warm .theme-title { color: #451a03; }
        body.theme-light-warm .theme-card-title { color: #78350f; }
        body.theme-light-warm .theme-card-sub { color: #d97706; }

        body.theme-light-forest {
            background: linear-gradient(to bottom right, #f0fdf4, #dcfce7, #bbf7d0);
            color: #14532d;
        }
        body.theme-light-forest .theme-card {
            background-color: #ffffff;
            border-color: #dcfce7;
            box-shadow: 0 20px 25px -5px rgba(187, 247, 208, 0.5);
        }
        body.theme-light-forest .theme-title { color: #14532d; }
        body.theme-light-forest .theme-card-title { color: #166534; }
        body.theme-light-forest .theme-card-sub { color: #22c55e; }

        body.theme-dark-midnight {
            background: linear-gradient(to bottom right, #09090b, #18181b, #27272a);
            color: #f4f4f5;
        }
        body.theme-dark-midnight .theme-card {
            background-color: #18181b;
            border-color: #27272a;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
        }
        body.theme-dark-midnight .theme-title { color: #fafafa; }
        body.theme-dark-midnight .theme-card-title { color: #f4f4f5; }
        body.theme-dark-midnight .theme-card-sub { color: #a1a1aa; }

        body.theme-dark-ocean {
            background: linear-gradient(to bottom right, #0a192f, #112240, #1d3557);
            color: #e2e8f0;
        }
        body.theme-dark-ocean .theme-card {
            background-color: #112240;
            border-color: #1d3557;
            box-shadow: 0 20px 25px -5px rgba(10, 25, 47, 0.8);
        }
        body.theme-dark-ocean .theme-title { color: #64ffda; }
        body.theme-dark-ocean .theme-card-title { color: #ccd6f6; }
        body.theme-dark-ocean .theme-card-sub { color: #8892b0; }

        body.theme-dark-emerald {
            background: linear-gradient(to bottom right, #022c22, #064e3b, #065f46);
            color: #ecfdf5;
        }
        body.theme-dark-emerald .theme-card {
            background-color: #064e3b;
            border-color: #047857;
            box-shadow: 0 20px 25px -5px rgba(2, 44, 34, 0.9);
        }
        body.theme-dark-emerald .theme-title { color: #34d399; }
        body.theme-dark-emerald .theme-card-title { color: #a7f3d0; }
        body.theme-dark-emerald .theme-card-sub { color: #6ee7b7; }
    </style>
</head>

<body class="theme-light-slate min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white transition-colors duration-300">

    <!-- Header Section -->
    <header class="w-full py-10 px-6 sm:px-12 max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight theme-title mb-0">
            FFTA Hub
        </h1>

        <!-- Theme Picker Dropdown -->
        <div class="flex items-center space-x-2 bg-black/10 dark:bg-white/10 backdrop-blur-md p-1.5 rounded-xl border border-white/20 shadow-sm">
            <span class="text-xs font-semibold px-2 uppercase tracking-wider opacity-85">Theme:</span>
            <select id="themeSelector" onchange="switchTheme(this.value)" class="bg-transparent text-sm font-medium py-1.5 px-3 rounded-lg focus:outline-none cursor-pointer">
                <optgroup label="Bright Modes">
                    <option value="theme-light-slate" class="bg-slate-100 text-slate-800">☀️ Clean Slate (Bright)</option>
                    <option value="theme-light-warm" class="bg-amber-50 text-amber-900">🌅 Warm Amber (Bright)</option>
                    <option value="theme-light-forest" class="bg-green-50 text-green-900">🌿 Mint Forest (Bright)</option>
                </optgroup>
                <optgroup label="Dark Modes">
                    <option value="theme-dark-midnight" class="bg-zinc-900 text-zinc-100">🌙 Midnight Dark (Dark)</option>
                    <option value="theme-dark-ocean" class="bg-[#0a192f] text-cyan-300">🌊 Deep Ocean (Dark)</option>
                    <option value="theme-dark-emerald" class="bg-[#022c22] text-emerald-300">🌲 Emerald Night (Dark)</option>
                </optgroup>
            </select>
        </div>
    </header>

    <!-- Main Grid Container -->
    <main class="w-full max-w-7xl mx-auto px-6 sm:px-12 pb-20 flex-grow">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">

            <!-- Card 1: Quest Database -->
            <a href="quest.html"
                class="card-hover-effect theme-card rounded-2xl shadow-xl border p-5 flex items-center justify-between group cursor-pointer">
                <div class="flex items-center space-x-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-xl shrink-0 group-hover:bg-sky-600 group-hover:text-white transition-colors duration-300">
                        <i class="fa-solid fa-scroll"></i>
                    </div>
                    <h2 class="text-md sm:text-xl font-bold theme-card-title group-hover:text-sky-600 transition-colors">
                        Quest Database
                    </h2>
                </div>
                <div class="theme-card-sub group-hover:text-sky-600 group-hover:translate-x-1 transition-all duration-300">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Card 2: Job Database -->
            <a href="job.html"
                class="card-hover-effect theme-card rounded-2xl shadow-xl border p-5 flex items-center justify-between group cursor-pointer">
                <div class="flex items-center space-x-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center text-xl shrink-0 group-hover:bg-teal-600 group-hover:text-white transition-colors duration-300">
                        <i class="fa-solid fa-hand-fist"></i>
                    </div>
                    <h2 class="text-md sm:text-xl font-bold theme-card-title group-hover:text-teal-600 transition-colors">
                        Job Database
                    </h2>
                </div>
                <div class="theme-card-sub group-hover:text-teal-600 group-hover:translate-x-1 transition-all duration-300">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Card 3: Stat Code -->
            <a href="code.html"
                class="card-hover-effect theme-card rounded-2xl shadow-xl border p-5 flex items-center justify-between group cursor-pointer">
                <div class="flex items-center space-x-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl shrink-0 group-hover:bg-amber-600 group-hover:text-white transition-colors duration-300">
                        <i class="fa-solid fa-wand-sparkles"></i>
                    </div>
                    <h2 class="text-md sm:text-xl font-bold theme-card-title group-hover:text-amber-600 transition-colors">
                        Stat Code
                    </h2>
                </div>
                <div class="theme-card-sub group-hover:text-amber-600 group-hover:translate-x-1 transition-all duration-300">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Card 4: Map -->
            <a href="map.html"
                class="card-hover-effect theme-card rounded-2xl shadow-xl border p-5 flex items-center justify-between group cursor-pointer">
                <div class="flex items-center space-x-4">
                    <div
                        class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl shrink-0 group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-300">
                        <i class="fa-solid fa-map"></i>
                    </div>
                    <h2 class="text-md sm:text-xl font-bold theme-card-title group-hover:text-emerald-600 transition-colors">
                        Map
                    </h2>
                </div>
                <div class="theme-card-sub group-hover:text-emerald-600 group-hover:translate-x-1 transition-all duration-300">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

        </div>
    </main>

    <!-- JavaScript for Theme Switching & Persistence -->
    <script>
        function switchTheme(themeName) {
            const body = document.body;
            // Remove any existing theme classes
            body.className = body.className.replace(/theme-\S+/g, '').trim();
            // Add new theme
            body.classList.add(themeName, 'min-h-screen', 'flex', 'flex-col', 'justify-between', 'selection:bg-indigo-500', 'selection:text-white', 'transition-colors', 'duration-300');
            
            // Save to localStorage
            localStorage.setItem('ffta_hub_theme', themeName);

            // Handle dark class for tailwind if needed
            if (themeName.startsWith('theme-dark')) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // Initialize theme on load
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('ffta_hub_theme') || 'theme-light-slate';
            const selector = document.getElementById('themeSelector');
            if (selector) {
                selector.value = savedTheme;
            }
            switchTheme(savedTheme);
        });
    </script>
</body>

</html>
