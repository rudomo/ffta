    <!-- JavaScript for Interactive Simulation -->
    <script>
        function openModal(title, description) {
            event.preventDefault(); // Prevent default anchor jumping
            const modal = document.getElementById('detailModal');
            const modalContent = document.getElementById('modalContent');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = description;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            const modalContent = document.getElementById('modalContent');

            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 200);
        }

        function simulatePageOpen() {
            closeModal();
            // In a real application, this would redirect: window.location.href = "destination.html";
            console.log("Redirecting to the dedicated destination page successfully!");
        }

        // Close modal on background click
        window.onclick = function (event) {
            const modal = document.getElementById('detailModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
