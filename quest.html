<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FFTA Quest Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #00171f;
      --navy: #003459;
      --sea: #007ea7;
      --sky: #00a8e8;
      --white: #ffffff;
      --line: rgba(0, 126, 167, .35);
      --mute: rgba(255, 255, 255, .66);
      --hd: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
      --bd: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: dark
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      background: var(--ink)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--white);
      font: 15px/1.45 var(--bd);
      -webkit-text-size-adjust: 100%
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 20px 56px;
      position: relative;
    }

    .toggle-bar {
      position: absolute;
      top: 28px;
      right: 20px;
      height: 32px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid var(--sky);
      background: transparent;
      color: var(--sky);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px
    }

    .toggle-bar:hover {
      background: var(--sky);
      color: var(--ink)
    }

    .bar>:first-child {
      grid-column: 1/-1
    }

    .bar.hidden {
      display: none
    }

    .tag.rnd {
      border-style: dashed
    }

    .rd {
      border: 1px solid var(--sky);
      border-radius: 12px;
      background: var(--navy);
      color: var(--white);
      padding: 0;
      width: min(560px, calc(100vw - 24px));
      max-height: min(82vh, 680px);
      overflow: hidden;
      margin-top: 20px;
    }

    .rd[open] {
      display: flex;
      flex-direction: column
    }

    .rd::backdrop {
      background: rgba(0, 23, 31, .82)
    }

    .rd-h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line)
    }

    .rd-h h2 {
      margin: 0;
      font: 700 20px/1.2 var(--hd)
    }

    .rd-h p {
      margin: 2px 0 0;
      color: var(--mute);
      font-size: 13.5px
    }

    .rd-h .reset {
      height: 36px;
      padding: 0 14px;
      flex: none
    }

    .rd-l {
      margin: 0;
      padding: 12px 16px 16px 40px;
      overflow-y: auto;
      columns: 2 190px;
      column-gap: 28px
    }

    .rd-l li {
      padding: 3px 0;
      break-inside: avoid;
      overflow-wrap: anywhere
    }

    .rd-l li::marker {
      color: var(--sky);
      font-variant-numeric: tabular-nums
    }

    @media (max-width:700px) {
      .toggle-bar {
        top: 20px;
        right: 12px
      }
    }

    h1 {
      font: 700 clamp(28px, 5vw, 40px)/1.05 var(--hd);
      margin: 0 0 4px;
      letter-spacing: -.01em
    }

    .sub {
      margin: 0 0 22px;
      color: var(--mute)
    }

    .bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
      gap: 10px;
      align-items: end
    }

    label {
      display: block;
      font-size: 12.5px;
      color: var(--mute);
      margin-bottom: 4px
    }

    input,
    select,
    button {
      font: inherit;
      color: inherit
    }

    input[type=search],
    select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      background: var(--navy);
      border: 1px solid var(--sea);
      border-radius: 8px;
      color: var(--white)
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--sky) 50%), linear-gradient(135deg, var(--sky) 50%, transparent 50%);
      background-position: calc(100% - 17px) 18px, calc(100% - 12px) 18px;
      background-size: 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px
    }

    input::placeholder {
      color: rgba(255, 255, 255, .5)
    }

    .reset {
      height: 42px;
      padding: 0 18px;
      border-radius: 8px;
      border: 1px solid var(--sky);
      background: transparent;
      color: var(--sky);
      font-weight: 600;
      cursor: pointer
    }

    .reset:hover {
      background: var(--sky);
      color: var(--ink)
    }

    :focus-visible {
      outline: 2px solid var(--sky);
      outline-offset: 2px
    }

    .chain:empty {

      display: none
    }


    .chain {
      margin: 16px 0 8px;
      padding: 10px 12px;
      background: var(--navy);
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 0;
      min-height: 48px
    }

    .chain .hint {
      color: var(--mute);
      font-size: 14px
    }

    .chain .ttl {
      font-weight: 600;
      margin-right: 10px
    }

    .chip {
      border: 1px solid var(--sky);
      background: var(--ink);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .chip:hover {
      background: var(--sky);
      color: var(--ink)
    }

    .lk {
      width: 14px;
      height: 2px;
      background: var(--sky);
      flex: none
    }

    .clr {
      margin-left: auto;
      background: none;
      border: 0;
      color: var(--sky);
      text-decoration: underline;
      cursor: pointer;
      padding: 4px 0 4px 12px
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      align-items: center;
      margin: 12px 0 8px;
      color: var(--mute);
      font-size: 13.5px
    }

    .sw {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: -1px
    }

    .wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      color: var(--mute);
      padding: 10px 14px;
      background: var(--navy);
      white-space: nowrap
    }

    td {
      padding: 9px 14px;
      white-space: nowrap;
      border-top: 1px solid var(--line);
      vertical-align: middle
    }

    td.n {
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
      color: var(--sky);
      font-weight: 600;
      width: 1%
    }

    td.rq {
      display: table-cell
    }

    tr.row {
      cursor: pointer
    }

    tr.row:hover td,
    tr.row:focus-visible td {
      background: rgba(0, 52, 89, .6)
    }

    tr.m td:first-child {
      box-shadow: inset 3px 0 0 var(--sky)
    }

    tr.o td:first-child {
      box-shadow: inset 3px 0 0 var(--white)
    }

    tr.d td:first-child {
      box-shadow: inset 3px 0 0 var(--sea)
    }

    tr.inch td {
      background: rgba(0, 168, 232, .14)
    }

    tr.open td {
      background: var(--navy)
    }

    .tag {
      display: inline-block;
      margin: 0 6px 0 0;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid var(--sea);
      background: rgba(0, 168, 232, .12);
      color: var(--sky);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap
    }

    .tag:hover {
      background: var(--sky);
      color: var(--ink)
    }

    .tag.on {
      background: var(--sky);
      color: var(--ink);
      border-color: var(--sky);
      font-weight: 600
    }

    .cond {
      display: inline-block;
      margin: 0 6px 0 0;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px dashed var(--line);
      color: var(--mute);
      font-size: 13px
    }

    .dim {
      color: rgba(255, 255, 255, .4)
    }

    tr.det>td {
      padding: 0;
      background: var(--navy);
      border-top: 0;
      white-space: normal
    }

    .card {
      padding: 6px 18px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 28px;
      animation: in .18s ease-out;
      background-color: #004560;
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(-4px)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .card {
        animation: none
      }
    }

    .card h2 {
      grid-column: 1/-1;
      margin: 10px 0 0;
      font: 700 21px/1.2 var(--hd)
    }

    .card h2 small {
      font: 500 14px var(--bd);
      color: var(--sky);
      margin-right: 8px
    }

    .card section {
      min-width: 0
    }

    .card h3 {
      margin: 0 0 8px;
      font: 600 13px var(--bd);
      color: var(--sky);
      padding-bottom: 5px;
      border-bottom: 1px solid var(--line)
    }

    dl {
      margin: 0
    }

    .kv {
      display: flex;
      gap: 12px;
      padding: 3px 0;
      font-size: 14px
    }

    .kv dt {
      flex: 0 0 118px;
      color: var(--mute)
    }

    .kv dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere
    }

    .card .tag,
    .card .cond {
      white-space: normal;
      margin-bottom: 4px
    }

    .card .tag .f {
      display: inline
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px
    }

    .stat {
      background: var(--ink);
      border-radius: 8px;
      padding: 5px 10px
    }

    .stat b {
      display: block;
      font: 700 16px/1.1 var(--hd);
      text-align: center;
    }

    .stat span {
      font-size: 12.5px;
      color: var(--mute)
    }

    .items {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 14px
    }

    .items li {
      padding: 2px 0;
      overflow-wrap: anywhere
    }

    .items em {
      color: var(--mute)
    }

    .sk {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 18px
    }

    .sk div {
      display: grid;
      grid-template-columns: 34px 1fr 30px;
      gap: 8px;
      align-items: center;
      font-size: 13.5px
    }

    .sk i {
      display: block;
      height: 7px;
      border-radius: 4px;
      background: var(--ink);
      overflow: hidden
    }

    .sk i u {
      display: block;
      height: 100%;
      background: var(--sky)
    }

    .sk b {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .full {
      grid-column: 1/-1
    }

    .sh {
      display: none
    }

    .empty {
      padding: 28px 14px;
      color: var(--mute);
      white-space: normal
    }

    @media (max-width:700px) {
      main {
        padding: 20px 12px 44px
      }

      .bar {
        grid-template-columns: 1fr 1fr
      }

      .bar>:first-child {
        grid-column: 1/-1
      }

      .bar>:last-child {
        grid-column: 1/-1
      }

      .wrap {
        overflow: hidden
      }

      table {
        table-layout: fixed
      }

      th,
      td {
        padding: 9px 8px
      }

      th {
        overflow: hidden;
        text-overflow: ellipsis
      }

      .lg {
        display: none
      }

      .sh {
        display: inline
      }

      th:nth-child(1) {
        width: 6.2rem
      }

      th:nth-child(3) {
        width: 7.6rem
      }

      td.nm {
        overflow: hidden;
        text-overflow: ellipsis
      }

      td.rq {
        overflow: hidden
      }

      .tag {
        margin-right: 3px;
        padding: 2px 6px;
        font-size: 12px
      }

      .tag .f,
      .cond {
        display: none
      }

      td.rq:not(:has(.tag))::after {
        content: "\2014";
        color: rgba(255, 255, 255, .4)
      }

      .card .cond {
        display: inline-block
      }

      .card {
        grid-template-columns: 1fr;
        padding: 4px 12px 16px
      }

      .kv dt {
        flex-basis: 105px
      }

      .clr {
        margin-left: 0
      }
    }

    .tools {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px
    }

    .tools .toggle-bar {
      position: static
    }

    .card {
      position: relative
    }

    .card h2 {
      padding-right: 84px
    }

    .edit-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      height: 32px
    }

    .dd-b,
    .ed-b {
      padding: 16px;
      display: grid;
      gap: 12px;
      overflow-y: auto
    }

    .dd-b .reset {
      height: 42px;
      width: 100%
    }

    .dd-b p,
    .ed-b p {
      margin: 0;
      color: var(--mute);
      font-size: 14px
    }

    #ddm,
    #efe {
      min-height: 1.3em;
      color: var(--sky)
    }

    #efe {
      color: #ffcf56
    }

    .rd-h p {
      margin: 2px 0 0;
      color: var(--mute);
      font-size: 13.5px
    }

    .ed-b input,
    .ed-b textarea {
      width: 100%;
      padding: 9px 11px;
      background: var(--ink);
      border: 1px solid var(--sea);
      border-radius: 8px;
      color: var(--white);
      font: inherit
    }

    .ed-b textarea {
      resize: vertical;
      min-height: 64px
    }

    .ed-f {
      display: flex;
      justify-content: flex-end;
      gap: 10px
    }

    .ed-f .reset {
      height: 40px;
      padding: 0 20px
    }

    .ed-f .primary {
      background: var(--sky);
      color: var(--ink)
    }

    .ed-f .primary:hover {
      background: var(--white);
      border-color: var(--white)
    }

    @media (max-width: 440px) {
      .tools {
        /* position: static; */
        justify-content: flex-end;
        margin-bottom: 10px
      }
    }

    #edf {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1
    }

    .ed-b {
      min-height: 0
    }

    .qres {
      display: grid;
      gap: 4px;
      max-height: 168px;
      overflow-y: auto;
      margin-top: 6px
    }

    .qres button {
      text-align: left;
      padding: 5px 10px;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--white);
      cursor: pointer;
      font: inherit;
      font-size: 12px
    }

    .qres button b {
      color: var(--sky);
      margin-right: 6px
    }

    .qres button:hover:not(:disabled) {
      border-color: var(--sky);
      background: var(--navy)
    }

    .qres button:disabled {
      opacity: .5;
      cursor: default
    }

    .qres p {
      margin: 0;
      color: var(--mute);
      font-size: 14px
    }

    .note-t {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere
    }

    #ed {
      /* position: absolute; */
      position: sticky;
      inset: auto;
      left: 0;
      right: 0;
      margin: 0 auto;
      top: 12px;
      height: auto;
      max-height: none;
      overflow: visible
    }

    #ed .ed-b {
      overflow: visible
    }

    #ed .ed-f {
      position: static;
      background: none;
      padding: 0;
      margin: 0;
      justify-content: space-between;
      align-items: center
    }

    #ed .qres {
      /* max-height: none; */
      height: auto;
      max-height: 138px;
      align-content: start;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px
    }

    #ed textarea {
      resize: none;
      min-height: 0
    }

    #efe {
      min-height: 0;
      flex: 1
    }

    .ed-f {
      position: sticky;
      bottom: -16px;
      background: var(--navy);
      padding: 10px 0 0;
      margin-bottom: -4px
    }

    div.qres:has(p) {
      display: none;
    }

    #ed:open~table,
    #ed:open~* table,
    body:has(#ed:open) table,
    #rd:open~table,
    #rd:open~* table,
    body:has(#rd:open) table {
      display: none;
    }
  </style>
</head>

<body>
  <main>
    <div class="tools"><button type="button" id="dataBtn" class="toggle-bar" aria-haspopup="dialog">Data</button><button
        type="button" id="tbBtn" class="toggle-bar">Hide Search</button></div>
    <h1>FFTA QUEST</h1>
    <!-- <p class="sub">All 300 quests, searchable, sortable, and linked by what they require.</p> -->
    <div class="bar">
      <div><label for="q">Search all fields</label><input id="q" type="search" placeholder="" autocomplete="off"></div>
      <div><label for="cf">Category</label><select id="cf"></select></div>
      <div><label for="rf">Repeatable</label><select id="rf">
          <option value="">All</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select></div>
      <div><label for="sf">Sort by</label><select id="sf"></select></div>
      <div><label for="sd">Order</label><select id="sd">
          <option value="1">Ascending</option>
          <option value="-1">Descending</option>
        </select></div>
      <button class="reset" id="rs" type="button">Reset</button>
    </div>
    <div class="chain" id="chain" aria-live="polite"></div>
    <div class="meta"><span id="cnt" aria-live="polite"></span></div>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th><span class="lg">Quest Number</span><span class="sh">No.</span></th>
            <th>Quest Name</th>
            <th><span class="lg">Appearance Requirement</span><span class="sh">Requirement</span></th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </main>
  <dialog id="ed" class="rd" aria-labelledby="edt">
    <form id="edf" autocomplete="off">
      <div class="rd-h">
        <div>
          <h2 id="edt"></h2>
        </div><button type="button" class="reset" data-close>Cancel</button>
      </div>
      <div class="ed-b">
        <div><label for="ef-name">Quest Name</label><input id="ef-name" type="text"></div>
        <div><label for="ef-req">Appears when</label><textarea id="ef-req" rows="3"></textarea>
          <label for="ef-qs" style="margin-top:8px">Add a quest to Appears when</label>
          <input id="ef-qs" type="search" placeholder="Search quest name or number" autocomplete="off">
          <div class="qres" id="ef-res"></div>
        </div>
        <div><label for="ef-rec">Recruit</label><textarea id="ef-rec" rows="2"></textarea></div>
        <div><label for="ef-note">Note</label><textarea id="ef-note" rows="2"></textarea></div>
        <div class="ed-f">
          <p id="efe" role="alert"></p><button type="submit" class="reset primary">Save</button>
        </div>
      </div>
    </form>
  </dialog>
  <dialog id="dd" class="rd" aria-labelledby="ddt">
    <div class="rd-h">
      <div>
        <h2 id="ddt">Quest data</h2>
        <p id="dds"></p>
      </div><button type="button" class="reset" data-close>Close</button>
    </div>
    <div class="dd-b">
      <p>Edits are saved in this browser. Export and import use the same semicolon-separated CSV format as the original
        file.</p>
      <button type="button" class="reset" id="ddx">Export CSV</button>
      <button type="button" class="reset" id="ddi">Import CSV</button>
      <button type="button" class="reset" id="ddr">Reset to default data</button>
      <p id="ddm" role="status"></p>
    </div>
  </dialog>
  <input type="file" id="imp" accept=".csv,text/csv" hidden>
  <dialog id="rd" class="rd" aria-labelledby="rdt">
    <div class="rd-h">
      <div>
        <h2 id="rdt"></h2>
        <p id="rdc"></p>
      </div><button type="button" class="reset" data-close>Close</button>
    </div>
    <ol id="rdl" class="rd-l"></ol>

  <script>
    const EMB = JSON.parse(document.getElementById('d').textContent), LSK = 'ffta-quest-data-v1';
    const sameCols = (a, b) => a.length === b.length && a.every((h, i) => h === b[i]);
    function loadSaved() {
      try {
        const o = JSON.parse(localStorage.getItem(LSK));
        if (!o || !Array.isArray(o.h) || !Array.isArray(o.r) || !o.r.length) return null;
        let rows = o.r;
        if (sameCols(o.h, EMB.h.slice(0, -1))) rows = rows.map(r => [...r, '']);   // older save without Note
        else if (!sameCols(o.h, EMB.h)) return null;
        if (rows.every(r => Array.isArray(r) && r.length === EMB.h.length)) return {h: EMB.h, r: rows};
      } catch (e) { }
      return null;
    }
    const SAVED = loadSaved(), D = SAVED || EMB, H = D.h, R = D.r, ix = {};
    let usingSaved = !!SAVED;
    function saveData() {try {localStorage.setItem(LSK, JSON.stringify({h: H, r: R})); return true} catch (e) {return false} }
    H.forEach((h, i) => ix[h] = i);
    const SKN = ['Com', 'Mag', 'Smt', 'Crf', 'App', 'Gth', 'Neg', 'Trk'], SK = SKN.map(s => 'Clan Skills (' + s + ')');
    const num = v => {const m = /\d+/.exec(v); return m ? +m[0] : 0}, pad = n => String(n).padStart(3, '0');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    // Quest ids are plain numbers (001..300) or text ids (Rec-1, Add-3, Judge-2, League-4)
    const canon = x => /^\d+$/.test(x) ? String(+x) : x;
    const lab = id => /^\d+$/.test(id) ? id.padStart(3, '0') : id;
    // Quest links in Appears when are stored without the "Completed " prefix
    const normReq = (t, names) => t.replace(/(^|, )Completed (.+?) \(#([^)]+)\)/g, (m, pre, name, id) => (names.get(canon(id.trim())) === name || !name.includes(', ')) ? `${pre}${name} (#${id})` : m);
    {const nm = new Map(R.map(r => [canon(r[0].trim()), r[1]])); R.forEach(r => {r[6] = normReq(r[6], nm);});}
    const Q = R.map((r, i) => {
      const id = canon(r[0].trim());
      const o = {r, id, n: /^\d+$/.test(id) ? +id : 1000 + i, name: r[1], cat: r[2], req: r[6]};
      o.refs = [...r[6].matchAll(/\(#([^)]+)\)/g)].map(m => canon(m[1].trim()));
      o.sk = SK.map(k => num(r[ix[k]])); o.skt = o.sk.reduce((a, b) => a + b, 0);
      o.hay = (r.join(' | ') + ' | #' + lab(o.id)).toLowerCase(); return o
    });
    const byN = new Map(Q.map(q => [q.id, q]));
    function refreshQ(q) {
      const r = q.r;
      q.name = r[1]; q.req = r[6];
      q.refs = [...r[6].matchAll(/\(#([^)]+)\)/g)].map(m => canon(m[1].trim()));
      q.hay = (r.join(' | ') + ' | #' + lab(q.id)).toLowerCase();
    }
    const F = [['Quest Number', q => q.n], ['Quest Name', q => q.name.toLowerCase()], ['Category', q => q.cat], ['Price', q => num(q.r[ix['Price']])],
    ['Reward Gil', q => num(q.r[ix['Reward Gil']])], ['Reward AP', q => num(q.r[ix['Reward AP']])], ['Reward CP', q => num(q.r[ix['Reward CP']])],
    ['Clan Level Point', q => q.skt], ...SK.map((k, i) => [k, q => q.sk[i]])];
    const init = () => ({q: '', cat: '', rep: '', f: 0, d: 1, chain: [], open: null});
    let S = init();
    const $ = id => document.getElementById(id);
    $('cf').innerHTML = '<option value="">All categories</option>' + [...new Set(Q.map(q => q.cat))].sort().map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    $('sf').innerHTML = F.map((f, i) => `<option value="${i}">${f[0]}</option>`).join('');
    function parseReq(req) {
      const out = [], re = /\(#([^)]+)\)/g, conds = t => t.split(',').map(x => x.trim()).filter(Boolean).forEach(x => out.push({c: x}));
      let pos = 0, m;
      while ((m = re.exec(req))) {
        const id = canon(m[1].trim());
        const before = req.slice(pos, m.index).replace(/\s+$/, '').replace(/^[\s,]+/, '');
        const known = (byN.get(id) || {}).name;
        let name, rest;
        if (known && before.endsWith(known) && (before.length === known.length || /,\s*$/.test(before.slice(0, before.length - known.length)))) {name = known; rest = before.slice(0, before.length - known.length);}
        else {const k = before.lastIndexOf(', '); name = k >= 0 ? before.slice(k + 2) : before; rest = k >= 0 ? before.slice(0, k) : '';}
        conds(rest);
        out.push({n: id, name});
        pos = m.index + m[0].length;
      }
      conds(req.slice(pos));
      return out;
    }
    function renameRef(req, id, old, name) {
      const hits = [...req.matchAll(/\(#([^)]+)\)/g)].filter(m => canon(m[1].trim()) === id && req.slice(0, m.index).endsWith(old + ' ')).reverse();
      hits.forEach(m => {const a = m.index - old.length - 1; req = req.slice(0, a) + name + ' ' + req.slice(m.index);});
      return req;
    }
    const tags = q => parseReq(q.req).map(p => {
      if (p.n !== undefined) {const n = p.n; return `<button type="button" class="tag${S.chain.includes('#' + n) ? ' on' : ''}" data-n="${esc(n)}" title="Add #${lab(n)} and #${lab(q.id)} to the chain"><span class="f">${esc(p.name)} (</span>#${lab(n)}<span class="f">)</span></button>`}
      return `<span class="cond">${esc(p.c)}</span>`;
    }).join('') || '<span class="dim">&mdash;</span>';
    const v = x => (x === '' || x === '---') ? '<span class="dim">&mdash;</span>' : esc(x.replace(/^--(.*)--$/, '$1'));
    const g = (q, k) => q.r[ix[k]];
    const kv = (k, val) => `<div class="kv"><dt>${k}</dt><dd>${val}</dd></div>`;
    // Normalizes item names to ensure required items and reward items match
    const cleanItem = val => (val || '').replace(/ \[UNUSED\]$/, '');

    const allReqItems = new Set();
    Q.forEach(q => {
      const r1 = cleanItem(g(q, 'Required Item 1'));
      const r2 = cleanItem(g(q, 'Required Item 2'));
      if (r1 !== '---') allReqItems.add(r1);
      if (r2 !== '---') allReqItems.add(r2);
    });

    const RAND = JSON.parse(document.getElementById('rnd').textContent);
    function itemBtn(val) {
      if (!val || val === '---') return '<span class="dim">&mdash;</span>';
      const rm = /^--Type (\d+) Random Item--$/.exec(val);
      if (rm && RAND[rm[1]]) return `<button type="button" class="tag rnd" data-rand="${rm[1]}" aria-haspopup="dialog" title="Show the possible items">Type ${rm[1]} Random Item</button>`;
      let cName = cleanItem(val); // Used for tracking and matching (e.g., "Ahriman Eye")
      let disp = val.replace(/^--(.*)--$/, '$1'); // Used for display (e.g., "Ahriman Eye [UNUSED]")

      if (allReqItems.has(cName)) {
        return `<button type="button" class="tag${S.chain.includes(cName) ? ' on' : ''}" data-item="${esc(cName)}" title="Show quests linked to this item">${esc(disp)}</button>`;
      }
      return esc(disp);
    }

    function hasItem(q, c) {
      return cleanItem(g(q, 'Required Item 1')) === c ||
        cleanItem(g(q, 'Required Item 2')) === c ||
        cleanItem(g(q, 'Reward Item 1')) === c ||
        cleanItem(g(q, 'Reward Item 2')) === c ||
        cleanItem(g(q, 'Reward Item 3')) === c ||
        cleanItem(g(q, 'Reward Item 4')) === c;
    }
    function card(q) {
      const it = ['Reward Item 1', 'Reward Item 2', 'Reward Item 3', 'Reward Item 4'].map((k, i) => `<li><em>${i + 1}.</em> ${itemBtn(g(q, k))}</li>`).join('');
      const sk = SKN.map((s, i) => `<div><span>${s}</span><i><u style="width:${Math.min(q.sk[i], 100)}%"></u></i><b>${q.sk[i] || '<span class="dim">&mdash;</span>'}</b></div>`).join('');
      return `<div class="card"><button type="button" class="reset edit-btn" aria-haspopup="dialog" title="Edit this quest">Edit</button><h2><small>#${lab(q.id)}</small>${esc(q.name)}</h2>
 <section><h3>Quest</h3><dl>${kv('Category', v(q.cat))}${kv('Price', v(g(q, 'Price')))}${kv('Clear Condition', v(g(q, 'Clear Condition')))}${kv('Availability', v(g(q, 'Availability')))}${kv('Repeatable', v(g(q, 'Repeatable')))}${kv('Appears when', tags(q))}</dl></section>
<section><h3>Requirements</h3><dl>${kv('Required Item 1', itemBtn(g(q, 'Required Item 1')))}${kv('Required Item 2', itemBtn(g(q, 'Required Item 2')))}${kv('Skills/Job', v(g(q, 'Required Skills/Job')))}</dl>
 <h3 style="margin-top:16px">Recruit</h3><dl>${kv('Recruit', v(g(q, 'Recruit')))}</dl></section>
 <section><h3>Rewards</h3><div class="stats"><div class="stat"><b>${esc(g(q, 'Reward Gil'))}</b></div><div class="stat"><b>${esc(g(q, 'Reward AP'))}</b></div><div class="stat"><b>${esc(g(q, 'Reward CP'))}</b></div></div><ul class="items">${it}</ul></section>
 <section><h3>Clan skills</h3><div class="sk">${sk}</div></section>
 <section class="full"><h3>Note</h3><p class="note-t">${g(q, 'Note') ? esc(g(q, 'Note')) : '<span class="dim">No note.</span>'}</p></section></div>`
    }
    function view() {
      const t = S.q.toLowerCase().split(/\s+/).filter(Boolean);
      let a = Q.filter(q => t.every(x => q.hay.includes(x)));
      if (S.cat) a = a.filter(q => q.cat === S.cat);
      // Anything other than "No" (Yes, 20 days, 60 days...) counts as repeatable
      if (S.rep) a = a.filter(q => (g(q, 'Repeatable').trim().toLowerCase() !== 'no') === (S.rep === 'yes'));
      if (S.chain.length) {
        a = a.filter(q => S.chain.includes('#' + q.id) || S.chain.some(c => c[0] !== '#' && hasItem(q, c)));
      }
      const f = F[S.f][1];
      return a.sort((x, y) => {const A = f(x), B = f(y); return ((A < B ? -1 : A > B ? 1 : 0) * S.d) || (x.n - y.n)})
    }
    function render() {
      const a = view();
      const inChain = q => S.chain.includes('#' + q.id) || S.chain.some(c => c[0] !== '#' && hasItem(q, c));

      $('tb').innerHTML = a.length ? a.map(q => `<tr class="row ${q.cat === 'Main Quest' ? 'm' : q.cat === 'Dispatch Quest' ? 'd' : 'o'}${inChain(q) ? ' inch' : ''}${S.open === q.id ? ' open' : ''}" data-n="${esc(q.id)}" tabindex="0" aria-expanded="${S.open === q.id}"><td class="n">${lab(q.id)}</td><td class="nm">${esc(q.name)}</td><td class="rq">${tags(q)}</td></tr>${S.open === q.id ? `<tr class="det"><td colspan="3">${card(q)}</td></tr>` : ''}`).join('')
        : '<tr><td colspan="3" class="empty">No quests match. Adjust the search, filters or chain.</td></tr>';

      $('cnt').textContent = `Showing ${a.length} of ${Q.length} quests`;

      $('chain').innerHTML = S.chain.length
        ? '<span class="ttl">Chain</span>' + S.chain.map(c => c[0] === '#'
          ? `<button type="button" class="chip" data-rm="${esc(c)}" title="Remove from chain">#${lab(c.slice(1))} ${esc((byN.get(c.slice(1)) || {name: ''}).name)} &times;</button>`
          : `<button type="button" class="chip" data-rm-item="${esc(c)}" title="Remove from chain">Item: ${esc(c.replace(/^--(.*)--$/, '$1'))} &times;</button>`
        ).join('<i class="lk"></i>') + '<button type="button" class="clr" id="cc">Clear chain</button>'
        : '';
    }
    function openRand(n) {
      $('rdt').textContent = `Type ${n} Random Item`;
      $('rdc').textContent = `${RAND[n].length} possible items`;
      $('rdl').innerHTML = RAND[n].map(x => `<li>${esc(x)}</li>`).join('');
      $('rdl').scrollTop = 0;
      $('rd').showModal();
    }
    $('rd').addEventListener('click', e => {if (e.target === $('rd') || e.target.closest('[data-close]')) $('rd').close()});
    $('tb').addEventListener('click', e => {
      if (e.target.closest('.edit-btn')) {openEdit(S.open); return;}
      const tg = e.target.closest('.tag');
      if (tg) {
        if (tg.dataset.rand) {openRand(tg.dataset.rand); return;}
        if (tg.dataset.n) {
          const n = tg.dataset.n;
          // The quest whose requirement was clicked (table row, or the open detail card)
          const srcRow = tg.closest('tr.row');
          const src = srcRow ? srcRow.dataset.n : (tg.closest('tr.det') ? S.open : null);
          // Add the required quest first, then the quest that requires it
          [n, src].forEach(x => {if (x !== null && !S.chain.includes('#' + x)) S.chain.push('#' + x);});
        } else if (tg.dataset.item) {
          const item = tg.dataset.item;
          if (!S.chain.includes(item)) S.chain.push(item);
        }
        render();
        return;
      }
      const r = e.target.closest('tr.row');
      if (r) {const n = r.dataset.n; S.open = S.open === n ? null : n; render(); const el = document.querySelector(`tr.row[data-n="${n}"]`); if (el && S.open === n) el.focus({preventScroll: true})}
    });

    $('chain').addEventListener('click', e => {
      const c = e.target.closest('.chip');
      if (c) {
        if (c.dataset.rm) S.chain = S.chain.filter(n => n !== c.dataset.rm);
        else if (c.dataset.rmItem) S.chain = S.chain.filter(n => n !== c.dataset.rmItem);
      }
      else if (e.target.id === 'cc') S.chain = [];
      else return;
      render();
    });
    $('tb').addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr.row')) {e.preventDefault(); e.target.click()}
    });
    $('q').addEventListener('input', e => {S.q = e.target.value; render()});
    $('cf').addEventListener('change', e => {S.cat = e.target.value; render()});
    $('rf').addEventListener('change', e => {S.rep = e.target.value; render()});
    $('sf').addEventListener('change', e => {S.f = +e.target.value; render()});
    $('sd').addEventListener('change', e => {S.d = +e.target.value; render()});
    $('rs').addEventListener('click', () => {
      // Only reset search and sort state, keep S.chain and S.open intact
      S.q = '';
      S.cat = '';
      S.rep = '';
      S.f = 0;
      S.d = 1;

      // Reset the UI inputs
      $('q').value = '';
      $('cf').value = '';
      $('rf').value = '';
      $('sf').value = '0';
      $('sd').value = '1';

      render();
    });

    // Check saved preference on load
    const isHidden = localStorage.getItem('ffta_bar_hidden') === 'true';
    const bar = document.querySelector('.bar');
    const tbBtn = $('tbBtn');

    if (isHidden) {
      bar.classList.add('hidden');
      tbBtn.textContent = 'Show Search';
    }

    tbBtn.addEventListener('click', e => {
      bar.classList.toggle('hidden');
      const hidden = bar.classList.contains('hidden');
      e.target.textContent = hidden ? 'Show Search' : 'Hide Search';
      localStorage.setItem('ffta_bar_hidden', hidden);
    });

    // ---- Edit quest
    let EDIT = null;
    const EF = [['ef-name', 'Quest Name'], ['ef-req', 'Appearance Requirement'], ['ef-rec', 'Recruit'], ['ef-note', 'Note']];
    function openEdit(id) {
      const q = byN.get(id); if (!q) return;
      EDIT = q;
      $('edt').textContent = `Edit quest #${lab(q.id)}`;
      EF.forEach(([el, col]) => $(el).value = q.r[ix[col]]);
      $('efe').textContent = ''; $('ef-qs').value = ''; qSearch();
      $('ed').showModal();
      $('ed').style.top = (window.scrollY + 12) + 'px';
      $('ef-name').focus();
    }
    $('edf').addEventListener('submit', e => {
      e.preventDefault();
      const one = t => t.replace(/\s*[\r\n]+\s*/g, ' ').trim();
      const name = one($('ef-name').value);
      if (!name) {$('efe').textContent = 'Quest Name cannot be empty.'; return;}
      const old = EDIT.name, names = new Map(Q.map(o => [o.id, o.name]));
      EF.forEach(([el, col]) => {const raw = $(el).value; EDIT.r[ix[col]] = col === 'Quest Name' ? name : col === 'Note' ? raw.trim() : col === 'Appearance Requirement' ? (normReq(one(raw), names) || '---') : (one(raw) || '---');});
      if (old !== name) Q.forEach(o => {if (o !== EDIT && o.refs.includes(EDIT.id)) {o.r[6] = renameRef(o.r[6], EDIT.id, old, name); refreshQ(o);} });
      refreshQ(EDIT);
      const ok = saveData(); if (ok) usingSaved = true;
      $('ed').close();
      render();
      if (!ok) alert('Could not save to local storage. The change stays until this page is closed.');
    });
    function qSearch() {
      const t = $('ef-qs').value.trim().toLowerCase().replace(/^#/, ''), box = $('ef-res');
      if (!t) {box.innerHTML = '<p>Type a name or number to find a quest.</p>'; return;}
      const have = new Set(parseReq($('ef-req').value).filter(p => p.n !== undefined).map(p => p.n));
      const list = Q.filter(q => q !== EDIT && (q.name.toLowerCase().includes(t) || lab(q.id).toLowerCase().includes(t))).slice(0, 30);
      box.innerHTML = list.length ? list.map(q => `<button type="button" data-id="${esc(q.id)}"${have.has(q.id) ? ' disabled' : ''}><b>#${esc(lab(q.id))}</b>${esc(q.name)}${have.has(q.id) ? ' (added)' : ''}</button>`).join('') : '<p>No matching quests.</p>';
    }
    $('ef-qs').addEventListener('input', qSearch);
    $('ef-qs').addEventListener('keydown', e => {if (e.key === 'Enter') e.preventDefault();});
    $('ef-req').addEventListener('input', qSearch);
    $('ef-res').addEventListener('click', e => {
      const b = e.target.closest('button[data-id]'); if (!b || b.disabled) return;
      const q = byN.get(b.dataset.id), ta = $('ef-req'), cur = ta.value.trim();
      ta.value = (cur && cur !== '---' ? cur.replace(/[,\s]+$/, '') + ', ' : '') + `${q.name} (#${lab(q.id)})`;
      $('ef-qs').value = ''; qSearch(); $('ef-qs').focus();
    });
    // ---- Data dialog: export / import / reset
    const csvCell = t => /[;"\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    function exportCSV() {
      const text = '\ufeff' + [H, ...R].map(r => r.map(csvCell).join(';')).join('\r\n') + '\r\n';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
      a.download = 'FFTA_QUEST.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      $('ddm').textContent = `Exported ${R.length} quests to FFTA_QUEST.csv.`;
    }
    function parseCSV(t, d) {
      const rows = []; let row = [], f = '', inq = false;
      for (let i = 0; i < t.length; i++) {
        const c = t[i];
        if (inq) {if (c === '"') {if (t[i + 1] === '"') {f += '"'; i++} else inq = false} else f += c}
        else if (c === '"' && f === '') inq = true;
        else if (c === d) {row.push(f); f = ''}
        else if (c === '\n' || c === '\r') {if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''}
        else f += c;
      }
      if (f !== '' || row.length) {row.push(f); rows.push(row)}
      return rows;
    }
    function dataStatus() {$('dds').textContent = usingSaved ? 'Using data saved in this browser' : 'Using the default embedded data';}
    function openData(msg) {dataStatus(); $('ddm').textContent = msg || ''; $('dd').showModal();}
    $('dataBtn').addEventListener('click', () => openData());
    $('ddx').addEventListener('click', exportCSV);
    $('ddi').addEventListener('click', () => $('imp').click());
    $('imp').addEventListener('change', e => {
      const file = e.target.files[0]; e.target.value = '';
      if (!file) return;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const text = String(fr.result).replace(/^\ufeff/, '');
          const first = text.split(/\r?\n/)[0];
          const d = first.split(';').length >= first.split(',').length ? ';' : ',';
          const rows = parseCSV(text, d).filter(r => r.some(c => c.trim() !== ''));
          if (rows.length < 2) throw new Error('the file has no quest rows.');
          const head = rows[0].map(h => h.trim()), idx = H.map(h => head.indexOf(h));
          const miss = H.filter((h, i) => idx[i] < 0 && h !== 'Note');
          if (miss.length) throw new Error('missing column(s): ' + miss.join(', '));
          const out = rows.slice(1).map(r => idx.map(i => r[i] === undefined ? '' : r[i]));
          {const nm = new Map(out.map(r => [canon(r[0].trim()), r[1]])); out.forEach(r => {r[6] = normReq(r[6], nm);});}
          const ids = new Set();
          out.forEach((r, i) => {
            const id = canon(r[0].trim());
            if (!id) throw new Error(`row ${i + 2} has no Quest Number.`);
            if (ids.has(id)) throw new Error(`Quest Number ${r[0]} appears more than once.`);
            ids.add(id);
          });
          if (!confirm(`Replace the current quest data with ${out.length} quests from "${file.name}"?`)) return;
          localStorage.setItem(LSK, JSON.stringify({h: H, r: out}));
          sessionStorage.setItem('ffta-msg', `Imported ${out.length} quests from ${file.name}.`);
          location.reload();
        } catch (err) {$('ddm').textContent = 'Import failed: ' + err.message;}
      };
      fr.readAsText(file);
    });
    $('ddr').addEventListener('click', () => {
      if (!confirm('Discard all saved edits and imports and load the default embedded data?')) return;
      try {localStorage.removeItem(LSK);} catch (e) { }
      sessionStorage.setItem('ffta-msg', 'Default data restored.');
      location.reload();
    });
    ['ed', 'dd'].forEach(id => $(id).addEventListener('click', e => {if (e.target === $(id) || e.target.closest('[data-close]')) $(id).close()}));

    render();
    const pending = sessionStorage.getItem('ffta-msg');
    if (pending) {sessionStorage.removeItem('ffta-msg'); openData(pending);}
  </script>
</body>

</html>
